<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Leenardo</title>
  <style>
    :root {
      --bg: #faf9f6;
      --navy: #0d1b2a;
      --muted: #64748b;
      --card-bg: #ffffff;
      --border: #e2e8f0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #090d16;
        --navy: #f8fafc;
        --muted: #94a3b8;
        --card-bg: #111827;
        --border: #1e293b;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 3rem 2rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }
    .code {
      font-size: 3.5rem;
      font-weight: 800;
      letter-spacing: -0.05em;
      color: #3b82f6;
      line-height: 1;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 2rem;
    }
    a {
      display: inline-block;
      padding: 0.75rem 1.75rem;
      background: #0d1b2a;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 9999px;
      transition: opacity 0.2s;
    }
    a:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>Story or Page Not Found</h1>
    <p>The page, article, or resource you were looking for does not exist or is protected.</p>
    <a href="/index.html">Return to Leenardo Home</a>
  </div>
</body>
</html>
