  <style>
    :root {
      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --primary-light: #eef2ff;
      --slate-900: #0f172a;
      --slate-800: #1e293b;
      --slate-600: #475569;
      --slate-500: #64748b;
      --slate-200: #e2e8f0;
      --slate-100: #f1f5f9;
      --radius-lg: 16px;
      --shadow-md: 0 4px 16px rgba(15, 23, 42, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f8fafc;
      color: var(--slate-800);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .top-header {
      background: #ffffff;
      border-bottom: 1px solid var(--slate-200);
      padding: 0.85rem 1.5rem;
    }
    .top-header-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand-title {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      text-decoration: none;
      color: inherit;
    }
    .brand-title span {
      background: linear-gradient(135deg, var(--primary) 0%, #7c3aed 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .main-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
    }
    .error-card {
      background: #ffffff;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-lg);
      padding: 3rem 2.5rem;
      max-width: 580px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow-md);
    }
    .error-code {
      font-size: 5rem;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, var(--primary) 0%, #7c3aed 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }
    .error-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--slate-900);
      margin-bottom: 0.75rem;
    }
    .error-desc {
      font-size: 1rem;
      color: var(--slate-600);
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--primary);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.85rem 1.75rem;
      border-radius: 9999px;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
    }
    .btn-home:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <header class="top-header">
    <div class="top-header-inner">
      <a href="/" class="brand-title">
        <span>💎 Leenardo</span>
      </a>
    </div>
  </header>

  <main class="main-container">
    <div class="error-card">
      <div class="error-code">404</div>
      <h1 class="error-title">Aradığınız Sayfa Bulunamadı</h1>
      <p class="error-desc">
        Ulaşmaya çalıştığınız hikaye taşınmış, silinmiş ya da adresi yanlış yazılmış olabilir.
        Merak ettiğiniz yüzlerce hikayeyi keşfetmek için ana sayfaya dönebilirsiniz.
      </p>
      <a href="/" class="btn-home">
        <span>🏠 Ana Sayfaya Dön</span>
      </a>
    </div>
  </main>
</body>
</html>
